<meta property="og:type" content="website"><meta property="og:site_name" content="wlaque.cl"><meta property="og:locale" content="es_CL"><meta property="og:title" content="Desarrollo web freelance — Webflow y Shopify | wlaque.cl"><meta property="og:url" content="https://wlaque.cl/desarrollo-web/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1b1e14"><link rel="icon" href="assets/avatar-face.png">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"ProfessionalService","name":"Desarrollo web — wlaque.cl","url":"https://wlaque.cl/desarrollo-web/","provider":{"@type":"Person","name":"Wladimir Aqueveque H."},"serviceType":["Webflow","Shopify","Migración de WordPress"]}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bitacora.css">
<link rel="stylesheet" href="prosa.css">
<link rel="stylesheet" href="interior.css">
</head>
<body>
<div class="shell">
<div id="site-top"></div>
<main id="contenido">
<header class="phead">
<nav class="crumbs" aria-label="Ruta"><a href="index.html">Inicio</a><span aria-hidden="true">›</span><span aria-current="page">Desarrollo web</span></nav>
<h1 class="cursor">Desarrollo web</h1>
<p class="lede" id="lede"></p>
</header>
<div class="grid">
<div class="col">
<section aria-labelledby="h-que">
<div class="sec"><h2 id="h-que">Qué hago</h2><span class="r"></span></div>
<div class="units three" id="services"></div>
</section>
<section aria-labelledby="h-como" class="sec-gap">
<div class="sec"><h2 id="h-como">Cómo trabajo</h2><span class="r"></span></div>
<ol class="steps" id="steps"></ol>
</section>
<section aria-labelledby="h-incl" class="sec-gap">
<div class="sec"><h2 id="h-incl">Incluido en todos los proyectos</h2><span class="r"></span></div>
<ul class="incl" id="incl"></ul>
</section>
<section aria-labelledby="h-esc" class="sec-gap">
<div class="sec"><h2 id="h-esc">Lo he escrito</h2><span class="r"></span><a href="blog.html">Ver blog →</a></div>
<div class="log" id="log"></div>
</section>
<div class="cta"><div><b>¿Tienes un proyecto?</b><p id="cta-p"></p></div><a class="btn" href="contacto.html">Contáctame →</a></div>
</div>
<aside aria-label="Resumen">
<div class="sticky">
<div class="stat" id="stat"></div>
<div class="stat-l" id="stat-l"></div>
<h2 class="side-h">Plataformas</h2>
<ul><li class="pri">Webflow</li><li class="pri">Shopify</li><li>WordPress (rescates y migraciones)</li></ul>
<h2 class="side-h">Detalles</h2>
<dl class="facts" id="facts"></dl>
</div>
</aside>
</div>
</main>
<div id="site-foot"></div>
</div>
<script src="js/ongoro.js"></script>
<script src="js/site.js"></script>
<script>
Site.load().then(D => {
Site.mount("web");
const W = D.webdev, F = D.profile.freelance, esc = Site.esc;
document.getElementById("lede").textContent = W.lede;
document.getElementById("services").innerHTML = W.services.map(s => `<div class="unit"><div class="unit-top"><span class="unit-state ${s.tier==="principal" ? "" : "w"}"><i aria-hidden="true"></i>${s.platform}</span><span class="unit-year">${s.tier}</span></div><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p><div class="st">${esc(s.includes)}</div></div>`).join("");
document.getElementById("steps").innerHTML = W.steps.map((s,i) => `<li><span class="n">${String(i+1).padStart(2,"0")}</span><b>${esc(s.title)}</b><span>${esc(s.text)}</span></li>`).join("");
document.getElementById("incl").innerHTML = W.included.map(t => "<li>" + esc(t) + "</li>").join("");
document.getElementById("log").innerHTML = D.postsByDate.filter(p => p.type==="entrada" && (p.category==="Webflow" || p.category==="Dev")).slice(0, 3).map(Site.row).join("");
document.getElementById("cta-p").textContent = "Cuéntame qué necesitas y te respondo en " + W.response + ".";
document.getElementById("stat").textContent = F.projects;
document.getElementById("stat-l").textContent = F.projectsLabel;
document.getElementById("facts").innerHTML = `<dt>Respuesta</dt><dd>${W.response}</dd><dt>Contacto</dt><dd><a href="contacto.html">Formulario</a></dd>`;
}).catch(Site.fail);
</script>
</body>
</html>
