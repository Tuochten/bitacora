<script>
Site.load().then(D => {
  Site.mount("inicio");
  document.getElementById("bio").textContent = D.profile.bio;

  document.getElementById("guard").innerHTML = ongoroSVG(52) + '<div class="cap">guardián · en vigilia</div>';

  document.getElementById("skills").innerHTML = Site.skills();
  Site.postFilter({ filters:document.getElementById("filters"), list:document.getElementById("log"), pin:document.getElementById("pin"),
    label:document.getElementById("seclabel"), defaultLabel:"Entradas recientes", skipFeatured:true, limit:D.settings.homeRecent, type:"entrada" });
}).catch(Site.fail);
