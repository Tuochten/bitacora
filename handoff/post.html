<!-- Cuerpo de ejemplo. En producción sale de content/blog/<slug>.md -->
<template id="body-migrar-ordenes-woocommerce">
<p class="lead">Migrar pedidos entre producción y QA parece simple hasta que lo intentas. WooCommerce guarda una orden en al menos cuatro tablas distintas y romper una FK en producción es la clase de error que termina con tu domingo. Esta es la receta que terminamos usando: SQL directo, <span class="ic">INSERT IGNORE</span> y cero drama.</p>
<h2 id="contexto"><span class="n">01</span>El contexto</h2>
<p>Necesitábamos replicar pedidos reales en QA para probar una migración importante. La opción "exportar todo desde el panel de WordPress" no existe: las herramientas oficiales no incluyen pedidos completos con sus metas e ítems. Y los plugins comerciales que sí lo hacen cuestan más de lo que queríamos justificar para un script que íbamos a usar tres veces.</p>
<div class="note warn" role="note"><span class="k">Antes de empezar</span>Haz un backup completo de la base de datos de destino. Un <span class="ic">mysqldump</span> de cinco minutos te puede salvar horas de rollback. No es opcional.</div>
<h2 id="tablas"><span class="n">02</span>Las tablas involucradas</h2>
<p>WooCommerce distribuye una orden en al menos cuatro tablas principales. Hay que exportarlas en el orden correcto para respetar las foreign keys, o el destino rechaza todo en silencio:</p>
<ul>
<li><span class="ic">wp_posts</span>: la orden como tipo <span class="ic">shop_order</span></li>
<li><span class="ic">wp_postmeta</span>: datos del cliente, totales, dirección</li>
<li><span class="ic">wp_woocommerce_order_items</span>: productos del pedido</li>
<li><span class="ic">wp_woocommerce_order_itemmeta</span>: variaciones, atributos</li>
</ul>
<div class="code"><div class="code-h"><span>SQL · tablas a exportar</span><button type="button" data-copy>Copiar</button></div>
<pre><code><span class="c">-- 1. Orden principal</span>
SELECT * FROM wp_posts
  WHERE post_type = 'shop_order'
  AND post_date > '2025-04-13';

<span class="c">-- 2. Meta de la orden</span>
SELECT * FROM wp_postmeta
  WHERE post_id IN (...ids...);

<span class="c">-- 3. Ítems de la orden</span>
SELECT * FROM wp_woocommerce_order_items
  WHERE order_id IN (...ids...);</code></pre></div>
<h3>Generar el listado de IDs</h3>
<p>El truco está en armar el <span class="ic">IN (...ids...)</span> a partir de la primera consulta. phpMyAdmin tiene un export rápido que ya lo formatea como lista separada por comas: copia, pega, sigue.</p>
<h2 id="approach"><span class="n">03</span>El approach: INSERT IGNORE</h2>
<p>Para evitar errores por IDs duplicados en QA usamos <span class="ic">INSERT IGNORE</span> en lugar del <span class="ic">INSERT</span> estándar. Si el registro ya existe lo salta, sin reventar el resto del script. Para una migración idempotente esto es oro.</p>
<div class="note" role="note"><span class="k">Tip</span>En phpMyAdmin: Export → Custom → activa "INSERT IGNORE" en las opciones de generación. Te ahorras editar el archivo a mano con <span class="ic">sed -i</span> después.</div>
<h2 id="resultado"><span class="n">04</span>Resultado final</h2>
<p>Con este método migramos 340 órdenes en menos de 10 minutos, sin conflictos de FK y con todos los metadatos intactos. El ambiente de QA quedó listo para probar el flujo completo.</p>

<script>
Site.load().then(D => {
Site.mount("blog");
const esc = Site.esc, L = D.postsByDate;
const p = L.find(x => x.slug===Site.param("slug")) || D.posts.find(x => x.featured);
const i = L.indexOf(p);
document.title = Site.shortTitle(p, 60) + " | wlaque.cl";
document.querySelector('meta[name="description"]').content = p.description;
document.getElementById("crumb-last").textContent = Site.shortTitle(p);
const P = Site.isProj(p) && p.project;
if (P){
  document.getElementById("crumb-last").insertAdjacentHTML("beforebegin", '<a href="blog.html?tipo=proyecto">Proyectos</a><span aria-hidden="true">›</span>');
  document.getElementById("projbox").hidden = false;
  document.getElementById("pfacts").innerHTML = `<dt>Estado</dt><dd>${P.state}</dd><dt>Desde</dt><dd>${P.since.replace(/\s*→/, "")}</dd><dt>Tipo</dt><dd>${P.kind}</dd><dt>Stack</dt><dd>${esc(P.stack)}</dd>`;
}
const cats = document.getElementById("cats"); cats.classList.add(p.category); cats.textContent = [P ? "Proyecto" : "", p.category, ...p.tags].filter(Boolean).join(" · ");
document.getElementById("h1").textContent = p.title;
const dt = document.getElementById("date"); dt.dateTime = p.date; dt.textContent = Site.fmtDate(p.date);
document.getElementById("read").textContent = p.readingTime + " de lectura";
// Portada: imagen si existe; si no, bloque de terminal con categoría y título corto.
document.getElementById("cover").outerHTML = p.cover
  ? `<div class="cover" role="img" aria-label="Portada: ${esc(p.title)}"></div>`
  : `<div class="cover-term" aria-hidden="true"><span class="cat ${p.category}">${p.category}</span><span class="p">~/${P ? "proyectos" : "blog/" + p.category.toLowerCase()}/</span><span class="t cursor">${esc(Site.shortTitle(p))}</span></div>`;
const tpl = document.getElementById("body-" + p.slug), prose = document.getElementById("prose");
prose.innerHTML = tpl ? tpl.innerHTML
  : p.body ? `<p class="lead">${esc(p.description)}</p><h2 id="resumen"><span class="n">01</span>Resumen</h2>` + p.body.map(t => "<p>" + esc(t) + "</p>").join("")
  : `<p class="lead">${esc(p.description)}</p><div class="note" role="note"><span class="k">Prototipo</span>El cuerpo de esta entrada no está en el prototipo. En producción sale de su archivo Markdown.</div>`;
// Paginador por fecha: Anterior = la inmediatamente más antigua, Siguiente = la más nueva.
const older = L[i+1], newer = L[i-1];
document.getElementById("pager").innerHTML =
  (older ? `<a href="${Site.postHref(older)}" rel="prev"><span>← Anterior</span>${esc(older.title)}</a>` : '<span class="pager-x" aria-hidden="true"></span>') +
  (newer ? `<a href="${Site.postHref(newer)}" rel="next"><span>Siguiente →</span>${esc(newer.title)}</a>` : '<span class="pager-x" aria-hidden="true"></span>');
// Relacionadas: misma categoría por fecha; si faltan, se completa con las más recientes.
const rel = L.filter(x => x!==p && x.category===p.category);
L.forEach(x => { if (rel.length < 2 && x!==p && !rel.includes(x)) rel.push(x); });
document.getElementById("rel").innerHTML = rel.slice(0,2).map(Site.row).join("");
document.getElementById("facts").innerHTML = `<dt>${P ? "Actualizado" : "Publicado"}</dt><dd>${Site.fmtDate(p.date)}</dd><dt>Lectura</dt><dd>${p.readingTime}</dd><dt>Tema</dt><dd><a href="blog.html?tema=${p.category}">${p.category}</a></dd>`;
const u = encodeURIComponent("https://wlaque.cl/blog/" + p.slug + "/");
document.getElementById("sh-li").href = "https://www.linkedin.com/sharing/share-offsite/?url=" + u;
document.getElementById("sh-x").href = "https://x.com/intent/post?url=" + u + "&text=" + encodeURIComponent(p.title);
const heads = [...prose.querySelectorAll("h2")], toc = document.getElementById("toc");
if (!heads.length) document.getElementById("side-toc").hidden = true;
toc.innerHTML = heads.map(h => `<li><a href="#${h.id}"><span class="n">${h.querySelector(".n").textContent}</span>${h.childNodes[1].textContent}</a></li>`).join("");
const links = [...toc.querySelectorAll("a")], fill = document.getElementById("readfill");
function onScroll(){
  const max = document.documentElement.scrollHeight - innerHeight;
  fill.style.width = (max > 0 ? scrollY / max * 100 : 0) + "%";
  let k = 0; heads.forEach((h,j) => { if (h.getBoundingClientRect().top < 140) k = j; });
  links.forEach((a,j) => a.classList.toggle("on", j===k));
}
addEventListener("scroll", onScroll, {passive:true}); onScroll();
prose.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => {
  navigator.clipboard && navigator.clipboard.writeText(b.closest(".code").querySelector("code").innerText).catch(()=>{});
  b.textContent = "Copiado"; setTimeout(() => b.textContent = "Copiar", 1400);
}));
document.getElementById("copylink").addEventListener("click", e => {
  navigator.clipboard && navigator.clipboard.writeText(location.href).catch(()=>{});
  e.target.textContent = "Enlace copiado"; setTimeout(() => e.target.textContent = "Copiar enlace", 1400);
});
}).catch(Site.fail);
</script>
